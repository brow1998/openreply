# OpenReply on the house Dokploy (reply.useshelfie.com).
#
# web + worker + cron share one image; Postgres, Redis and a private Postfix
# relay live in this stack. Every service has a memory limit: nothing else on
# the VPS should be able to starve the panel.
# Secrets come from the Dokploy panel (Environment), never from the repo.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: openreply-app:latest
  restart: unless-stopped
  networks:
    - default
  environment: &app-env
    NODE_ENV: production
    NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
    CRON_SECRET: ${CRON_SECRET:?}
    # Must be identical for web and worker, or sends fail to decrypt tokens.
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
    DATABASE_URL: postgresql://openreply:${POSTGRES_PASSWORD:?}@postgres:5432/openreply
    REDIS_URL: redis://redis:6379
    # The relay is on this stack's private network only; plain SMTP never
    # leaves the host. Its STARTTLS cert is self-signed, hence ignoreTLS.
    EMAIL_SERVER: smtp://mail:587?ignoreTLS=true
    EMAIL_FROM: ${EMAIL_FROM:-OpenReply <reply@useshelfie.com>}
    ALLOWED_EMAILS: ${ALLOWED_EMAILS:?without it anyone can sign up}
    # Where operational alerts (worker down, token expiring...) are mailed, besides workspace owners.
    OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-${ALLOWED_EMAILS}}
    META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
    INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
    INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
    FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    # Public id of the Meta app that owns the secret above; used for oEmbed.
    FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-3554568898033114}
    WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN:?}
    # Optional: GIF search in the composer (free key at developers.giphy.com).
    GIPHY_API_KEY: ${GIPHY_API_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    # Migrations need the database network, so they run at start, not build.
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    networks:
      - default
      - dokploy-network
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    deploy:
      resources:
        limits:
          memory: 512M

  cron:
    <<: *app
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
      CRON_SECRET: ${CRON_SECRET:?}
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: the send queue must survive a restart, or queued DMs are lost.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  # Private relay, same recipe as meubolso/pulseboard (boky/postfix, DKIM
  # selector `pulse` already published for useshelfie.com). Not on
  # dokploy-network on purpose: other stacks must not reach it.
  mail:
    image: boky/postfix:v5.1.0
    restart: unless-stopped
    depends_on:
      dkim-chave:
        condition: service_completed_successfully
    environment:
      # Space separated, never commas.
      ALLOWED_SENDER_DOMAINS: useshelfie.com
      HOSTNAME: mail.useshelfie.com
      DKIM_SELECTOR: pulse
    volumes:
      - dkim:/etc/opendkim/keys
    expose:
      - "587"
    deploy:
      resources:
        limits:
          memory: 128M

  dkim-chave:
    image: alpine:3.22
    restart: "no"
    environment:
      DKIM_PRIVATE_KEY_B64: ${DKIM_PRIVATE_KEY_B64:-}
    volumes:
      - dkim:/keys
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -z "$${DKIM_PRIVATE_KEY_B64}" ]; then
          echo "[dkim] no DKIM_PRIVATE_KEY_B64, relay will send unsigned"
          exit 0
        fi
        echo "$${DKIM_PRIVATE_KEY_B64}" | base64 -d > /keys/useshelfie.com.private
        chmod 600 /keys/useshelfie.com.private
    deploy:
      resources:
        limits:
          memory: 64M

  # Daily Postgres dump (custom format, restorable with pg_restore), 14 days kept
  # on the volume, plus a copy off the VPS when /root/openreply/rclone has a
  # config for BACKUP_REMOTE (default: the house R2 bucket, under /openreply).
  # Runs inside postgres:16-alpine so pg_dump always matches the server version.
  # First dump 5 minutes after start, then every 24 h. A failed dump never kills
  # the service (a restart loop would be worse than a missed dump).
  db-backup-cron:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-r2:shelfie-backups/openreply}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - backups:/backups
      - /root/openreply/rclone:/config/rclone:ro
    entrypoint:
      - sh
      - -c
      - |
        sleep 300
        while true; do
          (
            set -e
            f="/backups/$$(date -u +%Y%m%dT%H%M%SZ).dump"
            pg_dump -h postgres -U openreply -d openreply -Fc -f "$$f.parcial"
            mv "$$f.parcial" "$$f"
            echo "[backup] $$(du -h "$$f" | cut -f1) $$f"
            find /backups -name '*.dump' -mtime +14 -delete
            if [ -n "$$BACKUP_REMOTE" ]; then
              apk add --no-cache rclone >/dev/null
              rclone copy "$$f" "$$BACKUP_REMOTE" && echo "[backup] remote copy ok: $$BACKUP_REMOTE"
            else
              echo "[backup] no BACKUP_REMOTE: local copy only, same disk as the database"
            fi
          ) || echo "[backup] WARNING: the daily dump failed"
          sleep 86400
        done
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  backups:
  pgdata:
  redisdata:
  dkim:

networks:
  dokploy-network:
    external: true
